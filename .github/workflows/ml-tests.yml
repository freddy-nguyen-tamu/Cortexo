name: ml-tests

on:
  push:
  pull_request:

jobs:

  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          cd ml
          python -m pip install --upgrade pip
          pip install -e .

      - name: Byte-compile full package
        run: |
          cd ml
          python -m compileall -q src/cortexo_ml

      - name: Run unit tests (pure-python cores; torch optional)
        run: |
          cd ml
          pip install pytest
          pytest -q tests

  tiny-model-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with torch CPU
        run: |
          cd ml
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest torch --index-url https://download.pytorch.org/whl/cpu

      - name: Tiny model smoke (micro config, short forward/backward loop)
        run: |
          cd ml
          pytest -q tests -m tiny_model

# NOTE: models are never trained in GitHub Actions.