name: Regression

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  deterministic-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic regression (full mode, no committed report)
        run: python scripts/run_regression.py --mode full --no-history