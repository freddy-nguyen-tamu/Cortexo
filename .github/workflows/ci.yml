name: ci

on:
  push:
  pull_request:

jobs:

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          cd ml
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest torch
          pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: |
          cd apps/web-vue
          npm ci
          npm run build

  java:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: |
          cd apps/api-spring
          mvn -B test