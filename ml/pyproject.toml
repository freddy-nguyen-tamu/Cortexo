[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cortexo-ml"
version = "0.1.0"
description = "Cortexo ML research plane: tokenizer, scratch transformer, training, retrieval, agents, evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "orjson>=3.9",
  "psutil>=5.9",
  "tqdm>=4.66",
  "rich>=13.7",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "scikit-learn>=1.4",
  "rank-bm25>=0.2",
  "tree-sitter>=0.21",
  "tree-sitter-language-pack>=0.1",
  "networkx>=3.2",
  "pymongo>=4.6",
  "redis>=5.0",
  "psycopg[binary]>=3.1",
  "pytest>=8.0",
  "ruff>=0.4",
]

[project.optional-dependencies]
ml = [
  "torch>=2.2",
  "transformers>=4.41",
  "datasets>=2.19",
  "tokenizers>=0.19",
  "accelerate>=0.30",
  "peft>=0.11",
  "trl>=0.9",
  "safetensors>=0.4",
  "sentence-transformers>=2.7",
  "bitsandbytes>=0.43; platform_system == 'Linux' and platform_machine == 'x86_64'",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cortexo_ml = ["training/configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "tiny_model: tiny scratch-model forward/backward smoke (needs torch)",
]

[tool.ruff]
line-length = 100
target-version = "py311"