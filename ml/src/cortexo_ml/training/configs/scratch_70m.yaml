name: scratch-70m-code
seed: 42

model:
  vocab_size: 16384
  max_seq_len: 1024
  n_layers: 8
  d_model: 768
  n_heads: 12
  n_kv_heads: 12
  d_ff: 3072
  dropout: 0.0
  rope_theta: 10000.0
  rms_norm_eps: 0.00001
  tie_embeddings: true
  use_bias: false

training:
  micro_batch_size: 1
  gradient_accumulation_steps: 16
  learning_rate: 0.0002
  min_learning_rate: 0.00002
  warmup_steps: 1000
  max_steps: 30000
  weight_decay: 0.1
  grad_clip: 1.0
  precision: fp16
  save_every: 500
  eval_every: 250