server:
  port: ${SPRING_SERVER_PORT:8080}

spring:
  application:
    name: cortexo-api
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/cortexo}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/cortexo_eval}
    username: ${POSTGRES_USER:cortexo}
    password: ${POSTGRES_PASSWORD:cortexo}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

mysql:
  enabled: ${MYSQL_ENABLED:false}

sqlserver:
  enabled: ${SQLSERVER_ENABLED:false}

oracle:
  enabled: ${ORACLE_ENABLED:false}

db2:
  enabled: ${DB2_ENABLED:false}

cassandra:
  enabled: ${CASSANDRA_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

cortexo:
  ml-gateway-url: ${ML_GATEWAY_URL:http://localhost:8000}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  security:
    auth-enabled: ${AUTH_ENABLED:false}
    jwt-secret: ${JWT_SECRET:CHANGE_ME}
    jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}